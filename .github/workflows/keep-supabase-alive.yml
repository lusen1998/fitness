name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://kllajtqwejcsqvumyatr.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/user_data?select=user_id&limit=1")
          echo "HTTP Status: ${HTTP_CODE}"
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "406" ]; then
            echo "✅ Supabase is active"
            exit 0
          else
            echo "⚠️ Supabase may be paused (HTTP ${HTTP_CODE})"
            exit 1
          fi
